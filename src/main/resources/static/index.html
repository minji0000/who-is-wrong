<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 모바일 화면 대응을 위한 필수 뷰포트 태그 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>누구의 잘못일까?</title>
    <!-- Open Graph (카카오톡 공유 미리보기) -->
    <meta property="og:title" content="누구의 잘못일까? - AI 판정소">
    <meta property="og:description" content="누가 더 잘못했는지 AI에게 냉정하고 객관적인 판정을 받아보세요!">
    <meta property="og:url" content="https://who-is-wrong.onrender.com">
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            margin: 0;
            padding: 20px; /* 모바일에서 너무 꽉 차지 않도록 여백 조절 */
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }
        .chat-container {
            width: 100%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.9);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(255, 105, 180, 0.2);
            box-sizing: border-box; /* 패딩이 너비를 넘지 않도록 설정 */
        }
        h2 {
            color: #d81b60;
            margin-top: 0;
            text-align: center;
            font-size: 24px;
            margin-bottom: 10px;
        }
        /* 안내 문구 스타일 추가 */
        .guide-text {
            text-align: center;
            font-size: 13px;
            color: #7a7a7a;
            margin-bottom: 15px;
            line-height: 1.4;
            background: #fff8fa;
            padding: 10px;
            border-radius: 8px;
            border: 1px dashed #ffb6c1;
        }
        textarea {
            width: 100%;
            height: 90px;
            padding: 12px;
            box-sizing: border-box;
            resize: none;
            margin-bottom: 15px;
            border: 2px solid #ffb6c1;
            border-radius: 8px;
            font-size: 16px; /* 모바일에서 입력 시 화면이 자동 확대되는 현상 방지 (16px 이상 권장) */
            outline: none;
            transition: border-color 0.2s;
        }
        textarea:focus {
            border-color: #ff69b4;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #ff69b4;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #ff1493;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background: #fff0f5;
            border: 1px solid #ffc0cb;
            border-radius: 8px;
            white-space: pre-wrap;
            min-height: 60px;
            color: #4a4a4a;
            word-break: break-all; /* 긴 영단어 등이 박스를 뚫고 나가는 것 방지 */
            font-size: 15px;
        }
        .footer {
            margin-top: 20px;
            text-align: right;
            font-size: 12px;
            color: #b0578c;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <h2>💖 AI에게 물어봐</h2>
    <!-- 안내 및 예시 문구 추가 -->
    <div class="guide-text">
        누가 더 잘못했는지 억울한 사연을 적어보세요!<br>
        <span style="color: #b0578c; font-size: 12px; display: inline-block; margin-top: 4px;">
            (예: 유민이가 민지를 꽉 깨물었대.<br>
            유민이는 좋아서 그랬다는데 민지는 아파서 울었어.<br>
            누가 잘못한 거야?)
        </span>
    </div>

    <textarea id="messageInput" placeholder="갈등 상황이나 억울한 사연을 입력하세요..."></textarea>
    <button onclick="sendAI()">판정을 부탁해!</button>

    <div class="result-box" id="resultArea">여기에 AI 응답이 표시됩니다.</div>

    <div class="footer">개발자: 진카리</div>
</div>

<script>
    async function sendAI() {
        const message = document.getElementById('messageInput').value;
        const resultArea = document.getElementById('resultArea');

        if (!message.trim()) {
            alert('메시지를 입력해주세요!');
            return;
        }

        let dotCount = 0;
        resultArea.innerText = 'AI가 사연을 분석하고 있습니다';
        const loadingInterval = setInterval(() => {
            dotCount = (dotCount + 1) % 4;
            resultArea.innerText = 'AI가 사연을 분석하고 있습니다' + '.'.repeat(dotCount);
        }, 500);

        try {
            const response = await fetch(`/ai?message=${encodeURIComponent(message)}`);
            const data = await response.text();

            clearInterval(loadingInterval);
            resultArea.innerText = data;
        } catch (error) {
            clearInterval(loadingInterval);
            resultArea.innerText = '에러가 발생했습니다: ' + error;
        }
    }
</script>

</body>
</html>
