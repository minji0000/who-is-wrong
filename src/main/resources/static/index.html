<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 모바일 화면 대응을 위한 필수 뷰포트 태그 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:image" content="https://who-is-wrong.onrender.com/thumbnail.png">
    <title>누구의 잘못일까?</title>
    <!-- Open Graph (카카오톡 공유 미리보기) -->
    <meta property="og:title" content="누구의 잘못일까? - AI 판정소">
    <meta property="og:description" content="누가 더 잘못했는지 AI에게 냉정하고 객관적인 판정을 받아보세요!">
    <meta property="og:url" content="https://who-is-wrong.onrender.com">
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            margin: 0;
            padding: 20px; /* 모바일에서 너무 꽉 차지 않도록 여백 조절 */
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }
        .chat-container {
            width: 100%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.9);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(255, 105, 180, 0.2);
            box-sizing: border-box; /* 패딩이 너비를 넘지 않도록 설정 */
            margin-bottom: 20px;
        }
        h2 {
            color: #d81b60;
            margin-top: 0;
            text-align: center;
            font-size: 24px;
            margin-bottom: 10px;
        }
        /* 안내 문구 스타일 추가 */
        .guide-text {
            text-align: center;
            font-size: 13px;
            color: #7a7a7a;
            margin-bottom: 15px;
            line-height: 1.4;
            background: #fff8fa;
            padding: 10px;
            border-radius: 8px;
            border: 1px dashed #ffb6c1;
        }
        .textarea-wrapper {
            position: relative;
            margin-bottom: 15px;
        }
        textarea {
            width: 100%;
            height: 90px;
            padding: 12px;
            box-sizing: border-box;
            resize: none;
            margin-bottom: 15px;
            border: 2px solid #ffb6c1;
            border-radius: 8px;
            font-size: 16px; /* 모바일에서 입력 시 화면이 자동 확대되는 현상 방지 (16px 이상 권장) */
            outline: none;
            transition: border-color 0.2s;
        }
        textarea:focus {
            border-color: #ff69b4;
        }
        /* 글자 수 카운터 스타일 */
        .char-counter {
            position: absolute;
            bottom: 10px;
            right: 12px;
            font-size: 12px;
            color: #999;
            pointer-events: none;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #ff69b4;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #ff1493;
        }
        /* 비활성화된 버튼 스타일 */
        button:disabled {
            background-color: #ffb6c1;
            cursor: not-allowed;
        }
        .result-wrapper {
            position: relative;
            margin-top: 20px;
        }
        .result-box {
            padding: 15px;
            background: #fff0f5;
            border: 1px solid #ffc0cb;
            border-radius: 8px;
            white-space: pre-wrap;
            min-height: 60px;
            color: #4a4a4a;
            word-break: break-all; /* 긴 영단어 등이 박스를 뚫고 나가는 것 방지 */
            font-size: 15px;
        }
        /* 결과 복사하기 버튼 스타일 */
        #copyBtn {
            display: none; /* 결과가 나오기 전에는 숨김 */
            width: auto;
            padding: 6px 12px;
            font-size: 13px;
            background-color: #b0578c;
            position: absolute;
            top: 10px;
            right: 10px;
        }
        #copyBtn:hover {
            background-color: #8e4370;
        }
        /* 이전 판정 내역 영역 스타일 */
        .history-container {
            width: 100%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(255, 105, 180, 0.15);
            box-sizing: border-box;
        }
        .history-title {
            color: #d81b60;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 12px;
            border-bottom: 2px solid #ffb6c1;
            padding-bottom: 6px;
        }
        .history-item {
            background: #fff8fa;
            border: 1px solid #ffd1dc;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .history-item:last-child {
            margin-bottom: 0;
        }
        .history-q {
            font-weight: bold;
            color: #b0578c;
            margin-bottom: 4px;
        }
        .history-a {
            color: #555;
            white-space: pre-wrap;
        }
        .footer {
            margin-top: 20px;
            text-align: right;
            font-size: 12px;
            color: #b0578c;
            font-weight: bold;
        }

        /* 로딩 모달 스타일 */
        #loadingModal {
            display: none; /* 평소에는 숨김 */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .modal-content {
            background: white;
            padding: 25px 35px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            color: #d81b60;
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <h2>💖 AI에게 물어봐</h2>
    <!-- 안내 및 예시 문구 추가 -->
    <div class="guide-text">
        누가 더 잘못했는지 억울한 사연을 적어보세요!<br>
        <span style="color: #b0578c; font-size: 12px; display: inline-block; margin-top: 4px;">
            (예: 유민이가 민지를 꽉 깨물었대.<br>
            유민이는 좋아서 그랬다는데 민지는 아파서 울었어.<br>
            누가 잘못한 거야?)
        </span>
    </div>

    <div class="textarea-wrapper">
        <textarea id="messageInput" maxlength="500" placeholder="갈등 상황이나 억울한 사연을 입력하세요..." oninput="updateCounter()"></textarea>
        <div class="char-counter" id="charCounter">0 / 500자</div>
    </div>

    <button id="submitBtn" onclick="sendAI()">판정을 부탁해!</button>

    <div class="result-wrapper">
        <div class="result-box" id="resultArea">여기에 AI 응답이 표시됩니다.</div>
        <button id="copyBtn" onclick="copyResult()">📋 결과 복사</button>
    </div>

    <div class="footer">개발자: 진카리</div>
</div>

<!-- 최근 판정 내역 박스 -->
<div class="history-container">
    <div class="history-title">🔥 다른 사람들은 어떤 싸움을 했을까? (최근 3개 보여드려용)</div>
    <div id="historyList">
        <div style="text-align: center; color: #888; font-size: 13px;">불러오는 중...</div>
    </div>
</div>

<!-- 로딩 모달 -->
<div id="loadingModal">
    <div class="modal-content" id="modalText">
        AI가 사연을 분석하고 있습니다... 🤖 조금 늦어도 기다려주세용..
    </div>
</div>

<script>
    // 페이지 로드 시 최근 내역 불러오기
    window.onload = function() {
        loadRecentStories();
    };

    // 실시간 글자 수 카운터 함수
    function updateCounter() {
        const messageInput = document.getElementById('messageInput');
        const charCounter = document.getElementById('charCounter');
        const currentLength = messageInput.value.length;
        charCounter.innerText = `${currentLength} / 500자`;
    }

    // 최근 내역 비동기 조회 함수
    async function loadRecentStories() {
        const historyList = document.getElementById('historyList');
        try {
            const response = await fetch('/api/stories/recent');
            if (!response.ok) return;
            const stories = await response.json();

            if (stories.length === 0) {
                historyList.innerHTML = '<div style="text-align: center; color: #888; font-size: 13px;">아직 판정 내역이 없습니다! 첫 사연을 남겨보세요 ✨</div>';
                return;
            }

            let html = '';
            stories.forEach(story => {
                // 엔티티 필드명(content, aiResult)에 맞춰 렌더링
                html += `
                    <div class="history-item">
                        <div class="history-q">Q. ${escapeHtml(story.content)}</div>
                        <div class="history-a">A. ${escapeHtml(story.aiResult)}</div>
                    </div>
                `;
            });
            historyList.innerHTML = html;
        } catch (error) {
            console.error('최근 내역 조회 실패:', error);
            historyList.innerHTML = '<div style="text-align: center; color: #888; font-size: 13px;">내역을 불러오지 못했습니다.</div>';
        }
    }

    // XSS 방지용 HTML 특수문자 치환 함수
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>'"]/g, match => {
            switch (match) {
                case '&': return '&amp;';
                case '<': return '&lt;';
                case '>': return '&gt;';
                case '"': return '&quot;';
                case "'": return '&#39;';
            }
        });
    }

    async function sendAI() {
        const messageInput = document.getElementById('messageInput');
        const submitBtn = document.getElementById('submitBtn');
        const resultArea = document.getElementById('resultArea');
        const copyBtn = document.getElementById('copyBtn');
        const loadingModal = document.getElementById('loadingModal');
        const modalText = document.getElementById('modalText');

        const message = messageInput.value;

        if (!message.trim()) {
            alert('공백 말고 사연을 적어주세요!');
            messageInput.focus();
            return;
        }

        // 새로운 판정 시작 시 기존 복사 버튼 숨김
        copyBtn.style.display = 'none';

        let dotCount = 0;
        resultArea.innerText = 'AI가 사연을 분석하고 있습니다.';

        // 1. 로딩 시작: 버튼 비활성화, 입력창 잠금, 모달 띄우기
        submitBtn.disabled = true;
        messageInput.disabled = true;
        loadingModal.style.display = 'flex';

        const loadingInterval = setInterval(() => {
            dotCount = (dotCount + 1) % 4;
            const dots = '.'.repeat(dotCount);
            modalText.innerText = 'AI가 사연을 분석하고 있습니다 조금 느려도 기다려주세요..!' + dots;
        }, 500);

        try {
            const response = await fetch(`/ai?message=${encodeURIComponent(message)}`);
            const data = await response.text();

            clearInterval(loadingInterval);
            resultArea.innerText = data;

            // 결과가 정상적으로 나오면 복사 버튼 표시
            copyBtn.style.display = 'block';

            // 입력창 초기화 및 카운터 리셋
            messageInput.value = '';
            updateCounter();

            // 새로운 사연이 DB에 저장되었으므로 하단 최근 내역 갱신
            loadRecentStories();
        } catch (error) {
            clearInterval(loadingInterval);
            resultArea.innerText = '에러가 발생했습니다: ' + error;
        } finally {
            // 2. 완료 또는 에러 발생 시 무조건 원상복구
            submitBtn.disabled = false;
            messageInput.disabled = false;
            loadingModal.style.display = 'none';
        }
    }

    // 클립보드 복사 함수
    function copyResult() {
        const resultArea = document.getElementById('resultArea');
        const copyBtn = document.getElementById('copyBtn');
        const textToCopy = resultArea.innerText;

        navigator.clipboard.writeText(textToCopy).then(() => {
            copyBtn.innerText = '복사 완료! ✨';
            setTimeout(() => {
                copyBtn.innerText = '📋 결과 복사';
            }, 2000);
        }).catch(err => {
            alert('복사에 실패했습니다 ㅠㅠ');
            console.error(err);
        });
    }
</script>

</body>
</html>
