<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>누구의 잘못일까?</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            margin: 0;
            padding: 50px;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .chat-container {
            width: 100%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.9);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(255, 105, 180, 0.2);
        }
        h2 {
            color: #d81b60;
            margin-top: 0;
            text-align: center;
        }
        textarea {
            width: 100%;
            height: 90px;
            padding: 12px;
            box-sizing: border-box;
            resize: none;
            margin-bottom: 15px;
            border: 2px solid #ffb6c1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        textarea:focus {
            border-color: #ff69b4;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #ff69b4;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #ff1493;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background: #fff0f5;
            border: 1px solid #ffc0cb;
            border-radius: 8px;
            white-space: pre-wrap;
            min-height: 60px;
            color: #4a4a4a;
        }
        .footer {
            margin-top: 20px;
            text-align: right;
            font-size: 12px;
            color: #b0578c;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <h2>💖 AI에게 물어봐</h2>
    <textarea id="messageInput" placeholder="메시지를 입력하세요..."></textarea>
    <button onclick="sendAI()">판정을 부탁해!</button>

    <div class="result-box" id="resultArea">여기에 AI 응답이 표시됩니다.</div>

    <div class="footer">개발자: 카리</div>
</div>

<script>
    async function sendAI() {
        const message = document.getElementById('messageInput').value;
        const resultArea = document.getElementById('resultArea');

        if (!message.trim()) {
            alert('메시지를 입력해주세요!');
            return;
        }

        // 로딩 중 점(.)이 움직이는 효과 추가
        let dotCount = 0;
        resultArea.innerText = 'AI가 사연을 분석하고 있습니다';
        const loadingInterval = setInterval(() => {
            dotCount = (dotCount + 1) % 4;
            resultArea.innerText = 'AI가 사연을 분석하고 있습니다' + '.'.repeat(dotCount);
        }, 500);

        try {
            const response = await fetch(`/ai?message=${encodeURIComponent(message)}`);
            const data = await response.text();

            clearInterval(loadingInterval); // 로딩 애니메이션 중지
            resultArea.innerText = data;
        } catch (error) {
            clearInterval(loadingInterval);
            resultArea.innerText = '에러가 발생했습니다: ' + error;
        }
    }
</script>

</body>
</html>
